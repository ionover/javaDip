version: '3.7'

name: javadip

services:
  backend:
    build: backend
    container_name: javadip-backend
    environment:
      SPRING_FLYWAY_USER: ${DB_USER}
      SPRING_FLYWAY_PASSWORD: ${DB_PASS}
    ports:
      - "8084:8084"
    volumes:
      - /opt/javaDip/files_storage:/opt/files_storage

  frontend:
    build: frontend
    container_name: javadip-frontend
    ports:
      - "8080:80"

  postgres:
    image: postgres:17
    container_name: javadip-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: backend_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      PGUSER: ${DB_USER}
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
